<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa - BagPoint</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
    <link rel="manifest" href="/images/site.webmanifest" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
  </head>

  <body>
    <div class="page-container" id="content-js">
      <!-- HEADER -->
      <header>
        <nav class="navbar">
          <div class="nav-left">
            <a href="index.html"
              ><img class="logo" src="images/logo2.png" alt="logo"
            /></a>
          </div>

          <ul class="nav-center">
            <li><a href="index.html#how">Ako to funguje</a></li>
            <li><a href="index.html">Domov</a></li>
            <li><a href="kontakt.html">Kontakt</a></li>
            <li><a href="project/index.html">O projekte</a></li>
          </ul>

          <div class="nav-right">
            <a href="login.html" class="login-btn">Login</a>
            <a href="account.html" class="account-link">Môj účet</a>
            <a href="#" class="logout-link">Odhlásiť sa</a>
          </div>
        </nav>
      </header>

      <!-- MAIN -->
      <main class="map-page">
        <section class="map-section">
          <div id="map" class="leaflet-map">
            <div class="map-legend">
              <h4>BagPoint miesta v Trnave</h4>
              <p>Klikni na bod pre rezerváciu boxu</p>
            </div>
          </div>
        </section>

 
        <div id="reservation-modal" class="modal">
          <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="location-name">BagPoint</h3>

            <p>Vyber veľkosť boxu:</p>
            <select id="box-size">
              <option>Malý (S)</option>
              <option>Stredný (M)</option>
              <option>Veľký (L)</option>
            </select>

            <p>Dĺžka úschovy:</p>
            <select id="duration">
              <option>2 hodiny</option>
              <option>6 hodín</option>
              <option>Celý deň</option>
            </select>

            <button class="reserve-btn" onclick="startReservation()">Rezervovať</button>
          </div>
        </div>
      </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

   
    <script src="auth.js"></script>

    <script>
      const map = L.map("map").setView([48.3774, 17.5872], 14); // Trnava center

      
      L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
        attribution: "&copy; OpenStreetMap &copy; CARTO",
        subdomains: "abcd",
        maxZoom: 19,
      }).addTo(map);

      // Lokality
      const locations = [
        { name: "Trnava Centrum", coords: [48.3774, 17.5872] },
        { name: "City Arena", coords: [48.3725, 17.5931] },
        { name: "Stanica Trnava", coords: [48.3792, 17.6034] },
      ];

      // Custom BagPoint marker
      const bagpointIcon = L.icon({
        iconUrl:
          "data:image/svg+xml," +
          encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#089DFA"/>
                <stop offset="100%" stop-color="#0471C2"/>
              </linearGradient>
            </defs>
            <circle cx="256" cy="256" r="200" fill="url(#grad)" stroke="white" stroke-width="20"/>
            <path d="M256 160c-40 0-72 32-72 72v32h-32v88h208v-88h-32v-32c0-40-32-72-72-72zm0 24c26 0 48 22 48 48v32h-96v-32c0-26 22-48 48-48z" fill="white"/>
          </svg>
        `),
        iconSize: [46, 46],
        iconAnchor: [23, 45],
        popupAnchor: [0, -40],
      });

      // Markery
      locations.forEach((loc) => {
        const marker = L.marker(loc.coords, { icon: bagpointIcon }).addTo(map);
        marker.bindPopup(`
          <div class="popup-content">
            <b>${loc.name}</b><br>
            <button class="popup-btn" onclick="openReservation('${loc.name}')">Rezervovať</button>
          </div>
        `);
      });

     
      function openReservation(locationName) {
        document.getElementById("location-name").textContent = locationName;
        document.getElementById("reservation-modal").style.display = "flex";
      }

      function closeModal() {
        document.getElementById("reservation-modal").style.display = "none";
      }

      
      async function startReservation() {
        const size = document.getElementById("box-size").value;
        const duration = document.getElementById("duration").value;
        const location = document.getElementById("location-name").textContent;
        const userData = localStorage.getItem("user");

        if (!userData) {
          alert("Pre rezerváciu sa musíš prihlásiť.");
          window.location.href = "login.html";
          return;
        }

        const user = JSON.parse(userData);

        // Simulacia / buduci backend call
        try {
          const res = await fetch("../backend/createReservation.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              user_id: user.user_id,
              location,
              size,
              duration,
            }),
          });

          const data = await res.json();
          if (data.success) {
            alert("Rezervácia bola úspešná!");
            closeModal();
          } else {
            alert(data.message || "Nepodarilo sa vytvoriť rezerváciu.");
          }
        } catch (err) {
          console.error("Chyba:", err);
          alert("Chyba pri spojení so serverom.");
        }
      }
    </script>
  </body>
</html>
