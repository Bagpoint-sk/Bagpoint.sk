    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
    <link rel="manifest" href="/images/site.webmanifest" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div class="page-container">

      <!-- HEADER -->
      <header>
        <nav class="navbar">
          <div class="nav-left">
            <a href="index.html">
              <img class="logo" src="images/logo2.png" alt="logo" />
            </a>
          </div>

          <ul class="nav-center">
            <li><a href="index.html#how" class="nav-how">Ako to funguje</a></li>
            <li><a href="mapa.html" class="nav-map">Mapa</a></li>
            <li><a href="index.html" class="nav-home">Domov</a></li>
            <li><a href="project/index.html" class="nav-project">O projekte</a></li>
          </ul>

          <div class="nav-right">
            <a href="login.html" class="login-btn">Login</a>
            <a href="account.html" class="account-link">Môj účet</a>
            <a href="#" class="logout-link">Odhlásiť sa</a>
          </div>
        </nav>
      </header>

      <!-- MAIN -->
      <main>
        <section class="contact-section">
          <div class="contact-container">
            <div class="contact-info">
              <h1>Kontaktuj nás</h1>
              <p>Máš otázky, nápady alebo chceš spolupracovať? Ozvi sa nám!</p>

              <form class="contact-form">
                <label for="name">Meno</label>
                <input type="text" id="name" name="name" placeholder="Vaše meno" required />

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="meno@email.com" required />

                <label for="message">Správa</label>
                <textarea id="message" name="message" placeholder="Vaša správa..." required></textarea>

                <button type="submit" class="cta-btn">Odoslať</button>

                <p id="success-message" class="hidden">
                  <img src="images/success.svg" alt="úspech" class="success-check" />
                  Správa bola úspešne odoslaná!
                </p>
              </form>
            </div>

            <div class="contact-map">
              <iframe
                src="https://www.google.com/maps?q=Trnava,+Slovakia&output=embed"
                allowfullscreen
                loading="lazy">
              </iframe>
            </div>
          </div>
        </section>
      </main>

      <!-- FOOTER -->
      <footer>
        <div class="footer-container">
          <div class="footer-left">
            <img src="images/logo2.png" alt="logo" class="footer-logo" />
            <p>© 2025 BagPoint. Všetky práva vyhradené.</p>
          </div>

          <div class="footer-right">
            <a href="#"><img src="images/instagram.svg" alt="instagram" class="social-icon" /></a>
            <a href="#"><img src="images/facebook.svg" alt="facebook" class="social-icon" /></a>
            <a href="#"><img src="images/twitter.svg" alt="twitter" class="social-icon" /></a>
          </div>
        </div>
      </footer>
    </div>
 <!-- ODKAZY NA PROJEKT (GitHub + Render) -->
    <div class="project-links">
         <a
        href="https://github.com/Bagpoint-sk/Bagpoint.sk"
        class="project-link project-link--live"
        target="_blank"
        rel="noopener"
      >
        GitHub      
      </a>
    </div>
    
    <script src="auth.js"></script> 

    <script>
  // pockam kym sa nacita cely html (aby som vedela ze vsetky elementy uz existuju)
  document.addEventListener("DOMContentLoaded", () => {
    // najdem formular na kontakte (podla triedy)
    const contactForm = document.querySelector(".contact-form");

    // najdem element kde zobrazujem uspechu hlasku po odoslani
    const successMsg = document.getElementById("success-message");

    // ak formular existuje na tejto stranke, pripojim mu submit event
    if (contactForm) {
      contactForm.addEventListener("submit", async (e) => {
        // zastavim default spravanie formulara (aby sa nerefreshla stranka)
        e.preventDefault();

        // vyberiem hodnoty z inputov a orezeniem medzery na zaciatku/konci
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const message = document.getElementById("message").value.trim();

        // jednoducha validacia - ak je nieco prazdne, nepokracujem
        if (!name || !email || !message) {
          alert("Vyplň všetky polia.");
          return;
        }

        try {
          // poslem data na backend cez fetch (post + json)
          const res = await fetch("../backend/contactForm.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, message })
          });

          // backend ma vratit json odpoved (success true/false + message)
          const data = await res.json();

          if (data.success) {
            // ak to preslo, vycistim formular
            contactForm.reset();

            // zobrazim uspechu hlasku (odoberiem hidden a pridam show)
            successMsg.classList.remove("hidden");
            successMsg.classList.add("show");

            // po 5 sekundach hlasku zase skryjem
            setTimeout(() => {
              successMsg.classList.remove("show");
              successMsg.classList.add("hidden");
            }, 5000);
          } else {
            // ak backend vrati success=false, ukazem jeho message alebo fallback text
            alert(data.message || "Nepodarilo sa odoslať správu.");
          }
        } catch (err) {
          // ak sa nepodarilo spojenie alebo parsovanie, vypisem chybu do konzoly
          console.error("Chyba pri odoslaní:", err);

          // a ukazem userovi kratku hlasku
          alert("Chyba pri spojení so serverom.");
        }
      });
    }
  });
</script>

  </body>
</html>
