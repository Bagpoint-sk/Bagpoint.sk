<!DOCTYPE html>
<html lang="sk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Môj účet - BagPoint</title>
  <link rel="stylesheet" href="styles/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <div class="page-container">
    <!-- HEADER -->
    <header>
      <nav class="navbar">
        <div class="nav-left">
          <a href="index.html"><img class="logo" src="/Bagpoint.sk/frontend/images/logo2.png" alt="logo" /></a>
        </div>
        <ul class="nav-center">
          <li><a href="index.html#how">Ako to funguje</a></li>
          <li><a href="mapa.html">Mapa</a></li>
          <li><a href="kontakt.html">Kontakt</a></li>
        </ul>
        <div class="nav-right">
          <a href="#" class="logout-link">Odhlásiť sa</a>
        </div>
      </nav>
    </header>

    <main class="account-page">
      <div class="account-container fade-in">
        <aside class="account-sidebar">
          <h2>Menu</h2>
          <ul>
            <li class="tab-link active" data-target="account-section">
              Môj účet
            </li>
            <li class="tab-link" data-target="settings-section">
              Nastavenia
            </li>
          </ul>
        </aside>

        <section class="account-content">
          <div class="account-header">
            <div class="account-text">
              <h1>Môj účet</h1>
              <p class="user-email">
                Používateľ: <strong id="user-email">meno@email.com</strong>
              </p>
            </div>
            <img src="/Bagpoint.sk/frontend/images/profile.png" alt="Profilový obrázok" class="profile-pic" />
          </div>

          <div id="account-section" class="tab-content active">
            <h2>Moje rezervácie</h2>
            <div class="reservations-box">
              <p>Nemáš žiadne aktívne rezervácie.</p>
            </div>
          </div>

          <div id="settings-section" class="tab-content">
            <h2>Nastavenia účtu</h2>
            <button class="account-btn">Zmeniť heslo</button>
            <button class="account-btn delete">Zmazať účet</button>
          </div>
      </div>
  </div>
  </section>
  </div>
  </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch("../backend/getUser.php", {
          method: "GET",
          credentials: "include",
        });
        const data = await res.json();

        if (data.loggedIn) {
          const emaill = document.getElementById("user-email");
          if (emaill) emaill.textContent = data.user.email;
        } else {
          window.location.href = "login.html";
          return;
        }
      } catch (error) {
        console.error("Chyba pri načítaní používateľa:", error);
      }

      const logout = document.querySelector(".logout-link");

      if (logout) {
        logout.addEventListener("click", async (e) => {
          e.preventDefault();

          try {
            // poziadavka na logout
            const res = await fetch("../backend/logout.php", {
              method: "POST",
              credentials: "include", // posielanie session cookie
            });
            const data = await res.json();

            if (data.success) {
              // presmerovanie na hl site
              window.location.href = "index.html";
            } else {
              alert("Odhlásenie zlyhalo");
            }
          } catch (err) {
            console.error("Chyba pri odhlásení:", err);
          }
        });
      }
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const tabLinks = document.querySelectorAll(".tab-link");
      const tabContents = document.querySelectorAll(".tab-content");

      tabLinks.forEach((link) => {
        link.addEventListener("click", () => {
          tabLinks.forEach((l) => l.classList.remove("active"));
          tabContents.forEach((c) => c.classList.remove("active"));

          link.classList.add("active");
          document
            .getElementById(link.dataset.target)
            .classList.add("active");
        });
      });
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const showBtn = document.getElementById("show-change-password");
      const form = document.getElementById("change-password-form");

      if (!showBtn || !form) {
        console.error("Error!");
        return;
      }
      showBtn.addEventListener("click", () => {
        form.style.display = form.style.display === "none" ? "block" : "none";
      });
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const oldPassword = document
          .getElementById("old-password")
          .value.trim();
        const newPassword = document
          .getElementById("new-password")
          .value.trim();

        if (!oldPassword || !newPassword) {
          alert("Vyplň všetky polia.");
          return;
        }

        try {
          const res = await fetch("../backend/changePassword.php", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ oldPassword, newPassword }),
          });

          const data = await res.json();
          alert(data.message);

          if (data.success) {
            form.reset();
            form.style.display = "none";
          }
        } catch (err) {
          console.error("Chyba pri zmene hesla:", err);
          alert("Nastala chyba pri komunikácii so serverom.");
        }
      });
    });
  </script>
  <script src="scripts/main.js"></script>
</body>

</html>
