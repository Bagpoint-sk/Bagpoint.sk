<!DOCTYPE html>
<html lang="sk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Môj účet - BagPoint</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <div class="page-container">
    <!-- HEADER -->
    <header>
      <nav class="navbar">
        <div class="nav-left">
          <a href="index.html"><img class="logo" src="/images/logo2.png" alt="logo" /></a>
        </div>
        <ul class="nav-center">
          <li><a href="index.html#how">Ako to funguje</a></li>
          <li><a href="mapa.html">Mapa</a></li>
          <li><a href="kontakt.html">Kontakt</a></li>
        </ul>
        <div class="nav-right">
          <a href="#" class="logout-link">Odhlásiť sa</a>
        </div>
      </nav>
    </header>

    <!-- OBSAH -->
    <main class="account-page">
      <div class="account-container fade-in">
        <aside class="account-sidebar">
          <h2>Menu</h2>
          <ul>
            <li class="tab-link active" data-target="account-section">Môj účet</li>
            <li class="tab-link" data-target="settings-section">Nastavenia</li>
          </ul>
        </aside>

        <section class="account-content">
          <div class="account-header">
            <div class="account-text">
              <h1>Môj účet</h1>
              <p class="user-email">Používateľ: <strong id="user-email">meno@email.com</strong></p>
            </div>
            <img src="/images/profile.png" alt="Profilový obrázok" class="profile-pic" />
          </div>

          <div id="account-section" class="tab-content active">
            <h2>Moje rezervácie</h2>
            <div class="reservations-box">
              <p>Nemáš žiadne aktívne rezervácie.</p>
            </div>
          </div>

          <div id="settings-section" class="tab-content">
            <h2>Nastavenia účtu</h2>
            <button id="show-change-password" class="account-btn">Zmeniť heslo</button>
            <button id="show-delete-account" class="account-btn delete">Zmazať účet</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- MODAL: ZMENA HESLA -->
  <div id="change-modal" class="modal">
    <div class="modal-content">
      <h3>Zmena hesla</h3>
      <form id="change-password-form">
        <input type="password" id="old-password" placeholder="Staré heslo" required>
        <input type="password" id="new-password" placeholder="Nové heslo" required minlength="6">
        <div class="modal-buttons">
          <button type="submit" class="account-btn">Uložiť zmenu</button>
          <button type="button" id="cancel-change">Zrušiť</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: ZMAZANIE UCTU -->
  <div id="delete-modal" class="modal">
    <div class="modal-content">
      <h3>Potvrď zmazanie účtu</h3>
      <form id="delete-account-form">
        <input type="password" id="delete-password" placeholder="Zadaj svoje heslo" required>
        <div class="modal-buttons">
          <button type="submit" class="delete">Zmazať účet</button>
          <button type="button" id="cancel-delete">Zrušiť</button>
        </div>
      </form>
    </div>
  </div>

  <script>
document.addEventListener("DOMContentLoaded", () => {
  const EMAIL_EL = document.getElementById("user-email");

  // 1) Overenie používateľa
  fetch("/backend/getUser.php", { credentials: "include" })
    .then(r => r.json())
    .then(data => {
      if (!data || !data.loggedIn) {
        window.location.href = "login.html";
        return;
      }
      if (EMAIL_EL && data.user && data.user.email) EMAIL_EL.textContent = data.user.email;
      boot();
    })
    .catch(() => window.location.href = "login.html");

  // 2) Konštanty
  const activeListSel = "#active-list";
  const upcomingListSel = "#upcoming-list";
  const RATE_MAP = { "Malý (S)": 1.0, "Stredný (M)": 1.5, "Veľký (L)": 2.0 };

  const fmtHM = (mins) => {
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return `${h}h ${String(m).padStart(2, "0")}m`;
  };
  const hourlyRateForSizes = (sizes=[]) => sizes.reduce((s,x)=> s + (RATE_MAP[x] || 0), 0);
  const priceNowForSession = (sess) => {
    const start = new Date(sess.startedAt).getTime();
    const minutes = Math.max(0, Math.floor((Date.now() - start) / 60000));
    const blocks = Math.max(1, Math.ceil(minutes / 30)); // min. 1 blok
    const per30 = hourlyRateForSizes(sess.sizes) / 2;
    return { minutes, blocks, price: +(blocks * per30).toFixed(2) };
  };

  // 3) API
  async function apiGet(url) {
    const r = await fetch(url, { credentials: "include" });
    if (!r.ok) throw new Error("Network error");
    return r.json();
  }
  async function apiPost(url, payload) {
    const r = await fetch(url, {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload || {})
    });
    if (!r.ok) throw new Error("Network error");
    return r.json();
  }

  const EP = {
    activeSessions: "/backend/sessions_active.php",
    upcomingReservations: "/backend/reservations_upcoming.php",
    endSession: "/backend/sessions_end.php",
    cancelReservation: "/backend/reservations_cancel.php",
    openReservation: "/backend/reservations_open.php",
  };

  // 4) Štart
  let _cache = { sessions: [], reservations: [] };

  async function boot() {
    await refreshAll();
    wireTabs();
    startLiveTicker();
    wireLogout();
  }

  async function refreshAll() {
    const [sessionsResp, resvResp] = await Promise.all([
      apiGet(EP.activeSessions).catch(() => ({ success:false, sessions: [] })),
      apiGet(EP.upcomingReservations).catch(() => ({ success:false, reservations: [] })),
    ]);

    _cache.sessions = (sessionsResp && sessionsResp.success ? sessionsResp.sessions : []) || [];
    _cache.reservations = (resvResp && resvResp.success ? resvResp.reservations : []) || [];

    render();
    bindActions();
  }

  function render() {
    // Aktívne úschovy
    const activeList = document.querySelector(activeListSel);
    if (activeList) {
      if (!_cache.sessions.length) {
        activeList.innerHTML = `<div class="empty">Žiadne aktívne úschovy.</div>`;
      } else {
        activeList.innerHTML = _cache.sessions.map(s => {
          const pr = priceNowForSession(s);
          return `
            <div class="acc-card">
              <div class="acc-card__header">
                <div>
                  <div class="pill pill--active">AKTÍVNE</div>
                  <h4>${escapeHtml(s.locationName || "")}</h4>
                  <div class="meta">Box č. ${s.boxId ?? "—"} · ${escapeHtml((s.sizes||[]).join(", "))}</div>
                </div>
                <div class="price-now">
                  <div class="price-amt"><span data-sid="${s.id}" class="live-price">${pr.price.toFixed(2)}</span> €</div>
                  <div class="price-sub">účtovanie po 30 min</div>
                </div>
              </div>
              <div class="acc-card__body">
                <div class="stat">
                  <div class="stat-label">Trvanie</div>
                  <div class="stat-value"><span data-sid="${s.id}" class="live-time">${fmtHM(pr.minutes)}</span></div>
                </div>
                <div class="stat">
                  <div class="stat-label">Začiatok</div>
                  <div class="stat-value">${new Date(s.startedAt).toLocaleString()}</div>
                </div>
              </div>
              <div class="acc-card__footer">
                <button class="account-btn ghost" data-end="${s.id}">Ukončiť a zaplatiť</button>
              </div>
            </div>`;
        }).join("");
      }
    }

    // Nadchádzajúce rezervácie
    const upcomingList = document.querySelector(upcomingListSel);
    if (upcomingList) {
      if (!_cache.reservations.length) {
        upcomingList.innerHTML = `<div class="empty">Nemáš žiadne nadchádzajúce rezervácie.</div>`;
      } else {
        const todayStr = new Date().toISOString().split("T")[0];
        upcomingList.innerHTML = _cache.reservations.map(r => {
          const isToday = (r.dateFrom === todayStr);
          return `
            <div class="acc-card">
              <div class="acc-card__header">
                <div>
                  <div class="pill pill--hold">${isToday ? "DNES" : "REZERVÁCIA"}</div>
                  <h4>${escapeHtml(r.locationName || "")}</h4>
                  <div class="meta">${escapeHtml((r.sizes||[]).join(", "))}</div>
                </div>
                <div class="date-badge">${escapeHtml(r.dateFrom || "")}</div>
              </div>
              <div class="acc-card__body">
                <div class="info-line">Stav: <strong>${escapeHtml(r.status || "RESERVED")}</strong></div>
                <div class="info-note">V deň rezervácie sa po zaplatení pri termináli box otvorí.</div>
              </div>
              <div class="acc-card__footer">
                ${isToday ? `<button class="account-btn" data-open="${r.id}">Otvoriť box</button>` : ""}
                <button class="account-btn delete" data-cancel="${r.id}">Zrušiť</button>
              </div>
              ${isToday ? `<div class="pay-hint">Prosím zaplaťte pri termináli vedľa boxu. Po spracovaní platby sa box automaticky otvorí.</div>` : ""}
            </div>`;
        }).join("");
      }
    }
  }

  function bindActions() {
    // Ukončiť a zaplatiť
    document.querySelectorAll("[data-end]").forEach(btn => {
      btn.onclick = async () => {
        const id = btn.getAttribute("data-end");
        try {
          const resp = await apiPost(EP.endSession, { sessionId: id });
          if (!resp.success) throw new Error(resp.message || "Nepodarilo sa ukončiť.");
          alert(resp.message || "Úschova ukončená. Ďakujeme!");
          await refreshAll();
        } catch (e) {
          alert(e.message || "Chyba pri ukončení úschovy.");
        }
      };
    });

    // Zrušiť rezerváciu
    document.querySelectorAll("[data-cancel]").forEach(btn => {
      btn.onclick = async () => {
        const id = btn.getAttribute("data-cancel");
        if (!confirm("Naozaj chceš zrušiť túto rezerváciu?")) return;
        try {
          const resp = await apiPost(EP.cancelReservation, { reservationId: id });
          if (!resp.success) throw new Error(resp.message || "Nepodarilo sa zrušiť.");
          alert(resp.message || "Rezervácia zrušená.");
          await refreshAll();
        } catch (e) {
          alert(e.message || "Chyba pri rušení rezervácie.");
        }
      };
    });

    // Otvoriť box (DNES → ACTIVE)
    document.querySelectorAll("[data-open]").forEach(btn => {
      btn.onclick = async () => {
        const id = btn.getAttribute("data-open");
        alert("Prosím zaplaťte pri termináli vedľa boxu. Po zaplatení sa box otvorí.");
        try {
          const resp = await apiPost(EP.openReservation, { reservationId: id });
          if (!resp.success) throw new Error(resp.message || "Nepodarilo sa otvoriť box.");
          await refreshAll();
        } catch (e) {
          alert(e.message || "Chyba pri otváraní boxu.");
        }
      };
    });
  }

  // Živý prepočet každých 10 s
  function startLiveTicker() {
    setInterval(() => {
      (_cache.sessions || []).forEach(s => {
        const pr = priceNowForSession(s);
        document.querySelectorAll(`.live-time[data-sid="${s.id}"]`).forEach(el => el.textContent = fmtHM(pr.minutes));
        document.querySelectorAll(`.live-price[data-sid="${s.id}"]`).forEach(el => el.textContent = pr.price.toFixed(2));
      });
    }, 10000);
  }

  function wireTabs() {
    document.querySelectorAll(".tab-link").forEach(link => {
      link.addEventListener("click", () => {
        document.querySelectorAll(".tab-link").forEach(l => l.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
        link.classList.add("active");
        document.getElementById(link.dataset.target).classList.add("active");
      });
    });
  }

  function wireLogout() {
    const logoutLink = document.querySelector(".logout-link[href='#']");
    if (logoutLink) {
      logoutLink.addEventListener("click", (e) => {
        e.preventDefault();
        fetch("/backend/logout.php", { method: "POST", credentials: "include" })
          .finally(() => window.location.href = "index.html");
      });
    }
  }

  function escapeHtml(s) {
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
});
</script>

</body>

</html>
