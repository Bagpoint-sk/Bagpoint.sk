<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Môj účet - BagPoint</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
</head>

<body>
  <div class="page-container">
    <!-- HEADER -->
    <header>
      <nav class="navbar">
        <div class="nav-left">
          <a href="index.html"><img class="logo" src="images/logo2.png" alt="logo" /></a>
        </div>
        <ul class="nav-center">
          <li><a href="index.html#how">Ako to funguje</a></li>
          <li><a href="mapa.html">Mapa</a></li>
          <li><a href="kontakt.html">Kontakt</a></li>
        </ul>
        <div class="nav-right">
  <a href="#" class="logout-link">Odhlásiť sa</a>
</div>
      </nav>
    </header>

    <main class="account-page">
      <div class="account-container fade-in">
        <!-- SIDEBAR -->
        <aside class="account-sidebar">
          <h2>Menu</h2>
          <ul>
            <li class="tab-link active" data-target="account-section">Môj účet</li>
            <li class="tab-link" data-target="settings-section">Nastavenia</li>
          </ul>
        </aside>

       
        <section class="account-content">
          <div class="account-header">
            <div class="account-text">
              <h1>Môj účet</h1>
              <p class="user-email">Používateľ: <strong id="user-email">Načítavam...</strong></p>
            </div>
            <img src="images/profile.png" alt="Profilový obrázok" class="profile-pic" />
          </div>

          
          <div id="account-section" class="tab-content active">
            <h2>Moje rezervácie</h2>
            <div class="reservations-box" id="reservations-box">
              <p>Načítavam tvoje rezervácie...</p>
            </div>
          </div>

        
          <div id="settings-section" class="tab-content">
            <h2>Nastavenia účtu</h2>

            <div class="account-buttons">
              <button id="show-change-password" class="account-btn">Zmeniť heslo</button>
              <button id="delete-account" class="account-btn delete">Zmazať účet</button>
            </div>

            <form id="change-password-form" style="display: none;">
              <label for="oldPassword">Staré heslo</label>
              <input type="password" id="oldPassword" placeholder="Zadaj staré heslo" required>

              <label for="newPassword">Nové heslo</label>
              <input type="password" id="newPassword" placeholder="Zadaj nové heslo" required minlength="6">

              <button type="submit" class="account-btn">Uložiť zmenu</button>
            </form>

            <p id="message" class="status-message"></p>
          </div>
        </section>
      </div>
    </main>
  </div>











  
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const userData = localStorage.getItem("user");
      const logoutLink = document.querySelector(".logout-link");
      const userEmailEl = document.getElementById("user-email");
      const messageEl = document.getElementById("message");
      const reservationsBox = document.getElementById("reservations-box");
      const showChangeBtn = document.getElementById("show-change-password");
      const changeForm = document.getElementById("change-password-form");

      // --- kontrola prihlásenia
      if (!userData) {
        alert("Pre zobrazenie tejto stránky sa musíš prihlásiť.");
        window.location.href = "login.html";
        return;
      }

      // --- načítanie používateľa
      try {
        const res = await fetch("/Bagpoint/backend/getUser.php", { credentials: "include" });
        const data = await res.json();
        if (data.loggedIn && data.user) {
          userEmailEl.textContent = data.user.email;
        } else {
          userEmailEl.textContent = "Nepodarilo sa načítať údaje.";
        }
      } catch (err) {
        console.error("Chyba načítania:", err);
        userEmailEl.textContent = "Chyba pripojenia.";
      }

      // --- rezervácie (placeholder)
      reservationsBox.innerHTML = `<p>Nemáš žiadne aktívne rezervácie.</p>`;

      // --- odhlásenie
      logoutLink.addEventListener("click", async () => {
        try {
          const res = await fetch("/Bagpoint/backend/logout.php", { credentials: "include" });
          const data = await res.json();
          if (data.success) {
            localStorage.removeItem("user");
            window.location.href = "index.html";
          }
        } catch (err) {
          console.error("Chyba pri odhlásení:", err);
        }
      });

      // --- zobraziť/skryť formulár
      showChangeBtn.addEventListener("click", () => {
        changeForm.style.display = changeForm.style.display === "block" ? "none" : "block";
      });

      // --- zmena hesla
      changeForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const oldPassword = document.getElementById("oldPassword").value.trim();
        const newPassword = document.getElementById("newPassword").value.trim();

        try {
          const res = await fetch("/Bagpoint/backend/changePassword.php", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ oldPassword, newPassword })
          });

          const data = await res.json();
          showMessage(data.message || (data.success ? "Heslo bolo úspešne zmenené!" : "Zmena hesla zlyhala."));
          if (data.success) e.target.reset();
        } catch {
          showMessage("Nepodarilo sa zmeniť heslo.");
        }
      });

      // --- zmazanie účtu
      document.getElementById("delete-account").addEventListener("click", async () => {
        if (!confirm("Naozaj chceš zmazať svoj účet?")) return;

        try {
          const res = await fetch("/Bagpoint/backend/deleteAccount.php", {
            method: "POST",
            credentials: "include"
          });
          const data = await res.json();

          if (data.success) {
            alert("Účet bol úspešne zmazaný.");
            localStorage.removeItem("user");
            window.location.href = "index.html";
          } else {
            alert(data.message || "Zmazanie účtu zlyhalo.");
          }
        } catch {
          alert("Nepodarilo sa zmazať účet.");
        }
      });

      
      const tabLinks = document.querySelectorAll(".tab-link");
      const tabContents = document.querySelectorAll(".tab-content");
      tabLinks.forEach(link => {
        link.addEventListener("click", () => {
          tabLinks.forEach(l => l.classList.remove("active"));
          tabContents.forEach(c => c.classList.remove("active"));
          link.classList.add("active");
          document.getElementById(link.dataset.target).classList.add("active");
        });
      });

      
      function showMessage(msg) {
        messageEl.textContent = msg;
        messageEl.style.opacity = "1";
        setTimeout(() => (messageEl.style.opacity = "0"), 4000);
      }
    });
  </script>
</body>
</html>
