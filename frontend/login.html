<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prihlásenie - BagPoint</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
  </head>

  <body class="login-page">
    <div class="login-container fade-in">
      <div class="logo-section">
        <a href="index.html">
          <img src="images/logo2.png" alt="logo" class="logo" />
        </a>
      </div>

      <div class="login-card">
        <h2>Prihlásenie</h2>
        <p class="subtitle">Vitaj späť!</p>

        <form id="login-form" class="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="meno@email.com" required />
          </div>

          <div class="form-group">
            <label for="password">Heslo</label>
            <input type="password" id="password" placeholder="Zadaj heslo" required />
          </div>

          <button type="submit" class="login-btn2">Prihlásiť sa</button>
        </form>

        <p class="footer-text">
          Ešte nemáš účet? <a href="register.html">Zaregistruj sa</a>
        </p>

        <p id="login-message" class="status-message"></p>
      </div>
    </div>

    <script>
      document.getElementById("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const messageEl = document.getElementById("login-message");

        if (!email || !password) {
          messageEl.textContent = "Vyplň všetky polia.";
          messageEl.style.color = "red";
          return;
        }

        try {
          
          const response = await fetch("/Bagpoint/backend/login.php", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const text = await response.text();
          console.log("Odpoveď servera:", text);

          let data;
          try {
            data = JSON.parse(text);
          } catch (e) {
            messageEl.textContent = "Chybná odpoveď servera.";
            messageEl.style.color = "red";
            return;
          }

          if (data.success) {
            //  uložíme používateľa a presmerujeme bez alertov
            localStorage.setItem("user", JSON.stringify(data.user));
            window.location.href = "account.html";
          } else {
            messageEl.textContent = data.message || "Nesprávny email alebo heslo.";
            messageEl.style.color = "red";
          }
        } catch (err) {
          console.error("Chyba spojenia:", err);
          messageEl.textContent = "Chyba spojenia so serverom.";
          messageEl.style.color = "red";
        }
      });
    </script>
  </body>
</html>
