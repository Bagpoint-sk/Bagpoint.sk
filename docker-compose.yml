version: "3.9"

services:
  web:
    image: bagpoint-app
    container_name: bagpoint-web
    ports:
      - "3000:80"
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: bagpoint-db
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: bagpoint_sk
      MYSQL_ROOT_PASSWORD: ""
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: bagpoint-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ""

volumes:
  db_data:
