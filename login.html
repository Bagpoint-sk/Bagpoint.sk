<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BagPoint - Login</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon-32x32.png"
    />
  </head>

  <body class="login-page">
    <div class="login-container">
      <!-- LOGO -->
      <div class="logo-section">
        <a href="index.html">
          <img src="images/logo2.png" alt="logo" class="logo" />
        </a>
      </div>

      <!-- LOGIN CARD -->
      <div class="login-card fade-in">
        <h2>Prihlásenie</h2>
        <p class="subtitle">Vitaj späť</p>

        <form onsubmit="handleLogin(event)" class="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="meno@email.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Heslo</label>
            <input
              type="password"
              id="password"
              placeholder="Zadaj heslo"
              required
            />
          </div>
          <button class="login-btn2" type="submit">Prihlásiť sa</button>
        </form>

        <p class="footer-text">
          Nemáš účet? <a href="register.html">Zaregistruj sa</a>
        </p>
      </div>
    </div>

    <script>
      async function handleLogin(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
          alert("Vyplň všetky polia!");
          return;
        }

        try {
          const response = await fetch(
            "http://localhost/Bagpoint.sk/login.php",
            {
              method: "POST",
              credentials: "include",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            }
          );

          const text = await response.text();
          console.log("Odpoveď servera:", text);

          // pokus o parsovanie JSON
          let data;
          try {
            data = JSON.parse(text);
          } catch (e) {
            alert("Server nevrátil platný JSON!");
            console.error(text);
            return;
          }

          if (data.success) {
            alert("Prihlásenie úspešné!");

            // ulozenie prihlasenia
            localStorage.setItem("loggedIn", "true");
            localStorage.setItem("userName", data.user.name);
            localStorage.setItem("userEmail", data.user.email);

            // presmerovanie na profil
            window.location.href = "index.html";
          } else {
            alert(data.message || "Nesprávny email alebo heslo!");
          }
        } catch (error) {
          console.error(error);
          alert("Chyba spojenia so serverom.");
        }
      }
    </script>
  </body>
</html>
