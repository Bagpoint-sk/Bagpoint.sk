<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BagPoint - Login</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  </head>

 <body class="login-page">
    <div class="login-container">

      <!-- LOGO -->
      <div class="logo-section">
        <a href="index.html">
          <img src="images/logo2.png" alt="logo" class="logo">
        </a>
      </div>

      <!-- LOGIN CARD -->
      <div class="login-card fade-in">
        <h2>Prihlásenie</h2>
        <p class="subtitle">Vitaj späť</p>
        
<form onsubmit="handleLogin(event)" class="login-form">
       
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="meno@email.com" required>
          </div>

          <div class="form-group">
            <label for="password">Heslo</label>
            <input type="password" id="password" placeholder="Zadaj heslo" required>
          </div>
<button class="login-btn2" type="submit">Prihlásiť sa</button>

          
        </form>

        <p class="footer-text">Nemáš účet? <a href="register.html">Zaregistruj sa</a></p>
      </div>

    </div>



  <script>
  function handleLogin(event) {
    event.preventDefault(); // zabrani reloadu

    // simulacia prihlasenia
    localStorage.setItem('loggedIn', 'true');

    // presmerovanie na hlavnu stranku
    window.location.href = 'index.html';
  }
</script>



  </body>
</html>
